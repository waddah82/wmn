{% extends "templates/web.html" %}

{% block title %}Apps{% endblock %}

{% block page_content %}
<style>
html, body { margin: 0; padding: 0; overflow: hidden; }
.container, .page_content, .page-content, .page-content-wrapper, .web-page-content { max-width: 100% !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }

<div id="apps-shell">

</div>
{% endblock %}
